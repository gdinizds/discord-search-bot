spring:
  application:
    name: discord-search-bot
  config:
    import: "optional:consul:,optional:file:/vault/secrets/db.yaml,optional:file:/vault/secrets/s3.yaml"

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:consul-server.consul.svc.cluster.local}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        data-key: data

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 5000

  flyway:
    locations: classpath:db/migration
    schemas: search_bot
    default-schema: search_bot

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda.redpanda.svc.cluster.local:9093}
    consumer:
      group-id: discord-search-bot
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

search-bot:
  topics:
    inbound-interactions: discord.events.interaction.command
    inbound-commands: discord.events.message.command
    inbound-buttons: discord.events.interaction.button
    outbound-responses: discord.gateway.responses
    gateway-commands: discord.gateway.commands
  searxng:
    url: ${SEARXNG_URL:http://searxng.searxng.svc.cluster.local:8080}
    timeout: 6s
    default-language: pt-BR
    default-limit: 10
  s3:
    endpoint: ${GARAGE_ENDPOINT:http://garage.garage.svc.cluster.local:3900}
    bucket: ${GARAGE_BUCKET:discord-gateway-attachments}
    access-key: ${GARAGE_ACCESS_KEY:}
    secret-key: ${GARAGE_SECRET_KEY:}
    region: ${GARAGE_REGION:garage}
    key-prefix: search-bot
  images:
    download-timeout: 5s
    max-bytes: 10485760
    user-agent: "discord-search-bot/1.0 (+https://github.com/gdinizds/discord-search-bot)"
  executor:
    concurrency: 32
    drain-timeout: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 20s
    instances:
      searxng:
        base-config: default
        wait-duration-in-open-state: 20s
      s3:
        base-config: default
        wait-duration-in-open-state: 30s
      database:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  timelimiter:
    instances:
      searxng:
        timeout-duration: 6s
        cancel-running-future: true
      s3:
        timeout-duration: 8s
        cancel-running-future: true
  retry:
    instances:
      searxng:
        max-attempts: 2
        wait-duration: 1s
        enable-exponential-backoff: true
      s3:
        max-attempts: 2
        wait-duration: 500ms
      database:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.dao.DataIntegrityViolationException
  bulkhead:
    instances:
      search:
        max-concurrent-calls: 32
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, kafka
  health:
    circuitbreakers:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
